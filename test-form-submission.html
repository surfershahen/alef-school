<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Form Submission to Google Sheets</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #0056b3;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .result {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 15px;
        margin: 20px 0;
        white-space: pre-wrap;
      }
      .error {
        background: #f8d7da;
        border-color: #f5c6cb;
        color: #721c24;
      }
      .success {
        background: #d4edda;
        border-color: #c3e6cb;
        color: #155724;
      }
    </style>
  </head>
  <body>
    <h1>Test Form Submission to Google Sheets</h1>

    <form id="testForm">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required />
      </div>

      <div class="form-group">
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required />
      </div>

      <button type="submit" id="submitBtn">Submit to Google Sheets</button>
    </form>

    <div id="result" class="result" style="display: none"></div>

    <script>
      const NOCODE_API_URL =
        "https://v1.nocodeapi.com/shahenhamdan/google_sheets/hpvIeRGVPrCHbgmd";
      const TAB_ID = "student-data";

      async function submitFormData(formData) {
        try {
          console.log("Submitting form data to Google Sheets:", formData);

          // Create timestamp
          const timestamp = new Date().toLocaleString("en-US", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          });

          // Prepare data array for the new row
          const rowData = [
            timestamp,
            formData.name,
            formData.email,
            formData.phone,
            formData.city,
          ];

          console.log("Sending row data:", rowData);

          const response = await fetch(`${NOCODE_API_URL}?tabId=${TAB_ID}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify([rowData]),
          });

          if (!response.ok) {
            const errorText = await response.text();
            console.error("API request failed:", errorText);
            throw new Error(
              `HTTP error! status: ${response.status}, response: ${errorText}`
            );
          }

          const result = await response.json();
          console.log("Form data submitted successfully:", result);

          return {
            success: true,
            data: result,
          };
        } catch (error) {
          console.error("Error submitting form data:", error);
          return {
            success: false,
            error: error.message,
          };
        }
      }

      document
        .getElementById("testForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const submitBtn = document.getElementById("submitBtn");
          const resultDiv = document.getElementById("result");

          // Disable button and show loading
          submitBtn.disabled = true;
          submitBtn.textContent = "Submitting...";

          // Get form data
          const formData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            city: document.getElementById("city").value,
          };

          // Submit to Google Sheets
          const result = await submitFormData(formData);

          // Show result
          resultDiv.style.display = "block";
          if (result.success) {
            resultDiv.className = "result success";
            resultDiv.textContent =
              "SUCCESS! Form data submitted to Google Sheets:\n" +
              JSON.stringify(result.data, null, 2);
            // Reset form
            document.getElementById("testForm").reset();
          } else {
            resultDiv.className = "result error";
            resultDiv.textContent = "ERROR: " + result.error;
          }

          // Re-enable button
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit to Google Sheets";
        });
    </script>
  </body>
</html>
